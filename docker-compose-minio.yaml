version: "3.9"

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: elt_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"    
      - "9001:9001"    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - elt-net

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: elt_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        sleep 3 &&
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
        mc mb --ignore-existing local/adventureworks-elt &&
        echo '✅ Bucket adventureworks-elt siap'
       "
    restart: "no"
    networks:
      - elt-net

networks:
  elt-net:
    driver: bridge

volumes:
  minio-data:
